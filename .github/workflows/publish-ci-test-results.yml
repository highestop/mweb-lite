name: Publish CI test results
on:
  workflow_run:
    workflows: [macOS]
    types: [completed]
permissions: {}
concurrency:
  group: publish-test-results
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # Never execute publication code from an untrusted PR or artifact.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate artifact and publish report-only PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/publish-test-results.py --run-id "$SOURCE_RUN_ID"
