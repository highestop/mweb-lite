name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit and library integration tests
        run: swift test
      - name: Build application
        run: ./scripts/build-app.sh release
      - name: Package app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent "build/MWeb Lite.app" "build/MWeb Lite.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MWeb-Lite-macOS
          path: build/MWeb Lite.zip
