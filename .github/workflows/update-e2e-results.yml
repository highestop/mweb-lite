name: Update E2E result freshness
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Publish CI test results]
    types: [completed]
  workflow_dispatch:
permissions: {}
concurrency:
  group: publish-test-results
  cancel-in-progress: false
  queue: max
jobs:
  update:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # Always use trusted current default-branch code and complete Git history.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and update E2E freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-e2e-results.py
